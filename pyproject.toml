[project]
name = "mojo-usearch"
version = "0.1.0"
description = "Mojo SIMD exact dense-vector search with a usearch-compatible Python subset"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest", "usearch"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]
